<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#f8fafc"/>
  <!-- External: Developer & Internet -->
  <rect x="30" y="30" width="220" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="55" text-anchor="middle" font-weight="bold">Your Own Computer</text>
  <text x="140" y="75" text-anchor="middle">kubectl apply (Deploy instructions)</text>

  <rect x="370" y="30" width="220" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="55" text-anchor="middle" font-weight="bold">Internet (HTTP Client)</text>
  <text x="480" y="75" text-anchor="middle">HTTP Request to Cluster</text>

  <rect x="700" y="30" width="230" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="815" y="55" text-anchor="middle" font-weight="bold">External API (Outside Cluster)</text>
  <text x="815" y="75" text-anchor="middle">External Matchmaking / Auth API</text>

  <!-- Cluster Box -->
  <rect x="20" y="130" width="920" height="490" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="45" y="158" font-size="16" font-weight="bold" fill="#1e3a8a">Kubernetes Cluster</text>

  <!-- Services Layer -->
  <rect x="250" y="165" width="460" height="55" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="480" y="188" text-anchor="middle" font-weight="bold">Service (Ingress / LoadBalancer &amp; ClusterIP Services)</text>
  <text x="480" y="208" text-anchor="middle">Routes incoming HTTP traffic to Blog Website Pods &amp; Game Server Pods</text>

  <!-- Host Machine 1 -->
  <rect x="40" y="250" width="280" height="340" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="180" y="275" text-anchor="middle" font-weight="bold" font-size="14">Host Machine 1 (Node 1)</text>
  <rect x="60" y="295" width="240" height="65" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="180" y="322" text-anchor="middle" font-weight="bold">Control Plane (API Server)</text>
  <text x="180" y="342" text-anchor="middle">Receives kubectl commands</text>

  <rect x="60" y="380" width="240" height="180" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="405" text-anchor="middle" font-weight="bold">Pod: blog-app-pod-1</text>
  <rect x="80" y="425" width="200" height="110" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="180" y="465" text-anchor="middle" font-weight="bold">Container</text>
  <text x="180" y="485" text-anchor="middle">App 1: Blog Website</text>
  <text x="180" y="505" text-anchor="middle">(Node.js / Nginx :80)</text>

  <!-- Host Machine 2 -->
  <rect x="340" y="250" width="280" height="340" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="480" y="275" text-anchor="middle" font-weight="bold" font-size="14">Host Machine 2 (Node 2)</text>

  <rect x="360" y="295" width="240" height="115" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-weight="bold">Pod: blog-app-pod-2</text>
  <rect x="380" y="330" width="200" height="65" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="480" y="358" text-anchor="middle" font-weight="bold">Container: App 1 (Blog Replica)</text>
  <text x="480" y="378" text-anchor="middle">Serves HTTP requests</text>

  <rect x="360" y="425" width="240" height="145" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="448" text-anchor="middle" font-weight="bold">Pod: database-pod</text>
  <rect x="380" y="458" width="200" height="50" rx="6" fill="#ffffff" stroke="#0284c7"/>
  <text x="480" y="488" text-anchor="middle" font-weight="bold">Container: PostgreSQL DB</text>
  <rect x="380" y="516" width="200" height="42" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="480" y="542" text-anchor="middle" font-weight="bold">Volume (Persistent Storage)</text>

  <!-- Host Machine 3 -->
  <rect x="640" y="250" width="280" height="340" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="780" y="275" text-anchor="middle" font-weight="bold" font-size="14">Host Machine 3 (Node 3)</text>

  <rect x="660" y="310" width="240" height="240" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="338" text-anchor="middle" font-weight="bold">Pod: game-server-pod</text>
  <rect x="680" y="355" width="200" height="115" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="780" y="395" text-anchor="middle" font-weight="bold">Container</text>
  <text x="780" y="415" text-anchor="middle">App 2: Video Game Server</text>
  <text x="780" y="435" text-anchor="middle">(Dedicated Server :7777)</text>
  <rect x="680" y="485" width="200" height="48" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="780" y="514" text-anchor="middle" font-weight="bold">Volume (Game World Data)</text>

  <!-- Arrows -->
  <line x1="140" y1="90" x2="140" y2="295" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="480" y1="90" x2="480" y2="165" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="350" y1="220" x2="180" y2="380" stroke="#4f46e5" stroke-width="2"/>
  <line x1="480" y1="220" x2="480" y2="295" stroke="#4f46e5" stroke-width="2"/>
  <line x1="610" y1="220" x2="780" y2="310" stroke="#4f46e5" stroke-width="2"/>
  <line x1="815" y1="310" x2="815" y2="90" stroke="#d97706" stroke-width="2.5"/>
</svg>
